default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Dev & test DBs are served by process-compose (`nix run .#devenv`, see nix/shell.nix)
development:
  <<: *default
  database: dogbot_development
  host: 127.0.0.1
  port: 5434

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: dogbot_test
  host: 127.0.0.1
  port: 5434

# Connects over unix socket using peer auth
# (postgres role = system user running the app, see nix/module.nix)
production:
  <<: *default
  database: dogbot_production
  host: /run/postgresql
