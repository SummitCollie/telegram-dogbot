### Add configs to both of these to prevent dev env from stealing prod bot messasges:
###   rails credentials:edit                          # (for development/test)
###   rails credentials:edit --environment=production # (for prod)

# Used as the base secret for all MessageVerifiers in Rails, including the one protecting cookies.
secret_key_base: secureKeyBase123456789 # run `rails secret`

# If enabled, bot will refuse to run in non-whitelisted chats
whitelist_enabled: true
chat_id_whitelist:
  - -4276127923 # Some telegram chat ID
  - -4276127174 # Some other chat

# One of: huggingface, generic
llm_api_provider: generic

# Credentials/settings for llm_api_provider
openai:
  access_token: yourAccessToken
  model: llama-3.3-70b-versatile

  # uri_base: https://api-inference.huggingface.co/v1/
  uri_base: https://api.groq.com/openai/v1/

# Optional self-hosted Ollama server.
# Used whenever it's reachable and has a model installed whose name contains `model_match`
# (Ollama loads it on demand); otherwise requests go to `llm_api_provider` above.
# Matched against the full name from `ollama list`, so include the tag to pick a specific
# quantization when several are installed, e.g. `Qwen3.8-27B-Humanlike-Chat-GGUF:Q8_0`.
# Remove this section to disable.
local_llm:
  uri_base: http://10.0.0.1:11434
  model_match: Qwen3.8-27B-Humanlike-Chat

  # Model-specific params for Ollama's /api/chat (https://github.com/ollama/ollama/blob/main/docs/api.md)
  request_params:
    # false, or a reasoning effort: low/medium. Avoid `true`: some models treat it as
    # their default "xhigh" effort (~600 thinking tokens, over a minute per reply).
    think: low
    keep_alive: -1 # never unload the model (overrides OLLAMA_KEEP_ALIVE for this model's requests)
    options:
      num_ctx: 32768
      temperature: 1.0
      top_p: 0.95
      top_k: 20

  # Optional (also works under `openai:`): send each line of a chat reply as a separate
  # message, for models that "double-text" like a human. Only affects replies to mentions.
  split_replies: true

# Optional self-hosted FlareSolverr (https://github.com/FlareSolverr/FlareSolverr).
# /summarize_url retries through it when a site blocks the bot (e.g. Cloudflare challenges).
# Remove this section to disable.
flaresolverr:
  uri_base: http://127.0.0.1:8191

telegram:
  bot:
    # async: true # UNCOMMENT IN PRODUCTION
    token: TOKEN
    username: SomeBot # without the @
    first_name: DogBot # "Name" in BotFather settings
    owner_username: yourTgUsername # without the @

###           ###
### PROD ONLY ###
###           ###
# (In prod config, don't forget to also uncomment telegram.bot.async above ^)

# Passed as `secret_token` when calling telegram's `setWebhook`
# https://core.telegram.org/bots/api#setwebhook
telegram_secret_token: tgSecretToken123 # run `rails secret`

# Where to register telegram webhooks -- only needed for production
# because in development the bot just polls telegram's servers.
host_url: dogbot.example.com

